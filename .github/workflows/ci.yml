name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  patch-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @fieldwork-ai/fieldwork-code exec vitest run tests/apply-patch.test.ts tests/patch-upstream.test.ts
  macos-shell:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @fieldwork-ai/fieldwork-code exec vitest run tests/shell-session.test.ts tests/device-bootstrap.test.ts tests/foreground.test.ts
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install image rendering tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-liberation
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Upload terminal screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tui-screenshots
          path: .logs/tui-screenshots/
          include-hidden-files: true
          if-no-files-found: error
      - name: Smoke test published entry points
        run: |
          node packages/code/dist/code.js --version
          node packages/code/dist/code.js --help
          node --input-type=module -e 'await import("./packages/code/dist/agent/runner.js")'
